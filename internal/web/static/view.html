<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View · Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">A view is a drawing this page builds in the browser, so it needs JavaScript enabled.</p>
</noscript>

<main class="page">
<!-- Filled by pages/page.js setBreadcrumb once the page knows what it is
     looking at. It replaced this shell's back link: a trail says where you
     are as well as where you came from, in one component instead of four
     spellings across five screens. -->
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<!-- Everything on this page is built by pages/view.js: the frame owns
     every negative state (Task 4), the canvas owns the drawing and the
     drag layer (Task 7), and the ground panel owns the background
     (Task 14). The shell holds the holes and no words of its own —
     a sentence typed here would be a second copy of one the frame&#39;s
     model already carries. -->
<!-- The "Save as" dialog's hole. It is **outside** the drawing's
     wrapper on purpose: that wrapper is aria-hidden because the text
     twin is the accessible content of the answer, and a control a
     keyboard can reach inside it is a control a screen reader will not
     announce. A dialog is not part of the picture. -->
<div id="save-as-root"></div>
<!-- The fallback's hole. Below tablet width this page draws no picture
     and the text twin is the whole of the view (design spec §9), and
     this is where pages/view.js says so. It carries no words of its
     own for the same reason nothing else in this shell does. -->
<p class="notice" id="view-narrow" hidden></p>
<div id="view-root"></div>
<!-- The only thing this page says for itself, and only when the view
     could not be read at all: the frame needs an envelope or a refusal
     before it can say anything, and "this view does not exist" is
     neither. -->
<p class="error" id="view-error" hidden></p>

<!-- The entity panel a node click opens, over the canvas rather than
     instead of it: losing an arrangement to read a field would make
     reading fields feel expensive. -->
<aside id="entity-panel" class="side-panel" hidden aria-label="Entity"></aside>

</main>

<script type="module" src="/static/pages/view.js"></script>
