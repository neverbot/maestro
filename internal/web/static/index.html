<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games · Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">Listing your games needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page picker">
<!-- The page head every other screen has: the title, and the count of
     what is under it. It was a bare `h1` whose descenders touched the
     list's top border at 0.0px. -->
<div class="page-head">
  <h1>Your games</h1>
  <span class="page-actions" id="status" aria-live="polite"></span>
</div>
<!-- The picker's rows take the same scroller every other listing has:
     a 67-character game name exploded a row from 36px to 221px at 500px,
     which is the widest a row in this product has ever been. -->
<div class="scroller">
  <ul class="catalogue games wide" id="games" hidden></ul>
</div>

<!-- The first thing a brand-new account sees, in the same shape as every
     other empty state in the product. It was a bare sentence, which made
     the one screen that most needs to teach the odd one out. -->
<!-- The hole; app.js carries the words. -->
<div id="empty-state" hidden></div>

<!-- The way a game gets made, the first and every one after it. It sits
     beside the list rather than inside the empty state, because "create
     a game" stopped being an answer the moment you had one otherwise —
     and this shell is served at /games as well as at "/", so it is
     reachable from inside a game through the header's switcher. Hidden
     until app.js has an answer from GET /api/games, so an
     unauthenticated visitor about to be sent to /login never sees a form
     flash past.

     The disclosure is the form's manners beside a list it would
     otherwise push down. On an account with no games there is no list,
     so app.js marks it data-only-action and styles.css takes the
     summary away: the form is the screen. -->
<details id="new-game" hidden>
  <summary>New game</summary>
  <form id="create-game">
    <!-- **One field, because one is what a person has.** This asked for
         a Name and an Address, the second under a rule nobody had been
         told, with somebody else's game as the placeholder for both. The
         address is derived from the name now, by the server, so an agent
         creating a game over REST gets the same one; it is shown and can
         be changed afterwards in the game's own settings. -->
    <label for="create-game-name">Name</label>
    <input id="create-game-name" type="text" name="name" placeholder="Your game's name" autocomplete="off" required>
    <button type="submit">Create game</button>
    <p class="error" id="create-game-error" role="alert" aria-live="assertive"></p>
  </form>
</details>

</main>

<script type="module" src="/static/app.js"></script>
