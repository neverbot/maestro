<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images · Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">This page needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page">
<!-- Filled by pages/page.js setBreadcrumb once the page knows what it is
     looking at. It replaced this shell's back link: a trail says where you
     are as well as where you came from, in one component instead of four
     spellings across five screens. -->
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<div class="page-head">
<h1>Images</h1>
  <!-- What this screen cannot do, where the button would be.
       pages/page.js setReadOnly fills it. -->
  <span class="page-actions" id="page-actions"></span>
</div>
<p class="muted" id="assets-note" aria-live="polite">Loading this game&#39;s images…</p>

<!-- **The scroller, so a row is a row at any width**, and `wide` so the
     thumbnail, the id and the size have tracks of their own. The type
     page's own comment says why this wrapper exists; this list is the
     other one that needs it, and until an image had ever been rendered
     nobody could see that it did. -->
<div class="scroller">
  <ul class="catalogue wide" id="assets" hidden></ul>
</div>
<!-- The hole; pages/assets.js carries the words. -->
<div id="assets-empty" hidden></div>
<p class="error" id="assets-error" hidden></p>
<button type="button" class="link-button" id="assets-more" hidden>Show more images</button>

</main>

<script type="module" src="/static/pages/assets.js"></script>
