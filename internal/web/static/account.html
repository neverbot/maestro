<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.account"></title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">Your account needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page narrow">
<!-- **No breadcrumb.** A trail says where you are and how you got here;
     a single crumb reading "Your account" under an h1 reading "Your
     account" says it twice and costs 32px to do it. This screen is not
     inside anything: the header is the way back. -->

<div class="page-head">
<h1 data-i18n="account.title"></h1>
<!-- The head's third part, on the first screen in the product whose
     whole content is facts nobody can edit here. It is the component
     design.md wrote for exactly this: it states the limitation where
     somebody would look for the button. -->
<span class="page-actions"><span class="read-only" data-i18n="frame.readOnly" data-i18n-attr="title:account.whoFixed"></span></span>
</div>

<!-- **Two columns at a desk width.** Each section names itself on the
     left and answers on the right, which is the rail the page frame
     already describes and the only thing on these screens that uses the
     window. Stacked in one column, three headings and three forms read
     as one long form with nothing between them, and half of a 1440px
     screen was bare ground. Below 900px the two columns become one. -->
<section class="setting">
  <div class="setting-head">
    <h2 data-i18n="account.identity"></h2>
    <p class="muted" data-i18n="account.identity.about"></p>
  </div>
  <div class="setting-body">
    <dl class="facts" id="who">
      <dt data-i18n="form.name"></dt><dd id="who-name" class="muted" data-i18n="frame.loading"></dd>
      <dt data-i18n="form.email"></dt><dd id="who-email" class="muted" data-i18n="frame.loading"></dd>
      <dt data-i18n="account.since"></dt><dd id="who-since" class="muted" data-i18n="frame.loading"></dd>
    </dl>
    <p class="muted" id="who-admin" hidden data-i18n="account.youAdminister"></p>
    <p class="error" id="who-error" hidden></p>
  </div>
</section>

<section class="setting">
  <div class="setting-head">
    <h2 data-i18n="account.appearance"></h2>
    <p class="muted" data-i18n="account.appearance.about"></p>
  </div>
  <div class="setting-body">
    <!-- A radio group and not a toggle: there are three answers and one
         of them is "do not decide", which a two-state control cannot
         say. The page itself is the preview. -->
    <fieldset class="choices" id="theme">
      <legend class="sr-only" data-i18n="account.theme"></legend>
      <label><input type="radio" name="theme" value="system" checked><span data-i18n="account.theme.system"></span><span class="muted" id="theme-system-now"></span></label>
      <label><input type="radio" name="theme" value="light"><span data-i18n="account.theme.light"></span></label>
      <label><input type="radio" name="theme" value="dark"><span data-i18n="account.theme.dark"></span></label>
    </fieldset>
  </div>
</section>

<section class="setting">
  <div class="setting-head">
    <h2 data-i18n="account.language"></h2>
    <p class="muted" data-i18n="account.language.about"></p>
  </div>
  <div class="setting-body">
    <!-- The same shape as the theme above it, and for the same reason:
         three answers, one of which is "do not decide", which follows
         the browser's own languages. This one is kept in the account and
         not in the browser, because the choice is the person's. -->
    <fieldset class="choices" id="locale">
      <legend class="sr-only" data-i18n="account.language"></legend>
      <label><input type="radio" name="locale" value="" checked> <span data-i18n="account.language.browser"></span></label>
      <label><input type="radio" name="locale" value="en"> <span data-i18n="account.language.en"></span></label>
      <label><input type="radio" name="locale" value="es"> <span data-i18n="account.language.es"></span></label>
    </fieldset>
    <p class="muted" id="locale-done" hidden data-i18n="account.language.saved"></p>
    <p class="error" id="locale-error" role="alert" hidden></p>
  </div>
</section>

<section class="setting">
  <div class="setting-head">
    <h2 data-i18n="account.password"></h2>
    <p class="muted" data-i18n="login.noReset"></p>
  </div>
  <div class="setting-body">
<form id="password">
  <label for="password-current" data-i18n="account.currentPassword"></label>
  <input id="password-current" type="password" name="current_password" autocomplete="current-password" required>
  <label for="password-new" data-i18n="account.newPassword"></label>
  <input id="password-new" type="password" name="new_password"
         autocomplete="new-password" minlength="12" required>
  <!-- The rule, where it can be read. It lived in the placeholder, which
       design.md forbids and which disappears on the first keystroke,
       exactly when a person starts needing it. -->
  <p class="muted field-note" data-i18n="account.passwordRule"></p>
  <!-- **Under the field, above the button.** The sign-in screen printed
       its refusal below the submit button, so the reading order was
       field, action, reason. -->
  <p class="error" id="password-error" role="alert" aria-live="assertive"></p>
  <button type="submit" data-i18n="account.changePassword"></button>
  <p class="muted" id="password-done" hidden data-i18n="account.passwordChanged"></p>
</form>
  </div>
</section>

</main>

<script type="module" src="/static/pages/account.js"></script>
