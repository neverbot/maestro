services:
  maestro:
    build:
      context: .
      args:
        VERSION: dev
    image: maestro:dev
    environment:
      DATABASE_URL: postgres://maestro:maestro@db:5432/maestro?sslmode=disable
      # **`.test`, not `.com`.** RFC 6761 reserves `.test` for exactly
      # this: it can never be registered and never resolves, so a seeded
      # address here cannot be somebody's real mailbox and a credential
      # scanner reading a public repository cannot mistake this pair for
      # one. The address here was at a domain that exists, and a scanner
      # reading this public repository reported it and the line below as
      # a company email and its password. Both were placeholders; a
      # reader could not tell.
      FIRST_ADMIN_EMAIL: admin@example.test
      FIRST_ADMIN_PASSWORD: change-me-please
      # Seeds the admin account on an empty database. On a non-empty
      # one, every restart also re-promotes this account to admin if it
      # isn't already — leaving these two set permanently is deliberate.
      # Overwriting an existing account's password needs a separate
      # one-shot opt-in, FIRST_ADMIN_PASSWORD_RESET=true, for exactly
      # one restart (see "Recovering an admin" in readme.md).
      # Without it, an admin who rotates their own password keeps it
      # across every restart, sessions included.
      REGISTRATION_MODE: invite_only
    ports:
      - "${MAESTRO_HOST_PORT:-8090}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    # **200, because the tests run here now.** The suite runs a thousand
    # tests in parallel, each in a throwaway database of its own, and
    # Postgres ships with a limit of 100 connections: past it the
    # failure is `sorry, too many clients already` in whichever test
    # happened to be unlucky, which reads as a broken test and is not.
    #
    # Durability is left alone on purpose. A test database would be
    # faster with `fsync=off`, and this server also holds the games a
    # person is designing; a crash that costs them those is not worth
    # the seconds.
    command: ["postgres", "-c", "max_connections=200"]
    # Mapped for psql from the host while developing. The defaults avoid
    # the ports a sibling stack and the test container already hold:
    # 8090 rather than 8080, and 5433 rather than 5432 or the 55432 the
    # Go tests use. Override either with MAESTRO_HOST_PORT and
    # MAESTRO_DB_HOST_PORT.
    ports:
      - "${MAESTRO_DB_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
      POSTGRES_DB: maestro
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
