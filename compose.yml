services:
  maestro:
    build:
      context: .
      args:
        VERSION: dev
    environment:
      DATABASE_URL: postgres://maestro:maestro@db:5432/maestro?sslmode=disable
      # This is a local-dev-only value, not the literal placeholder
      # config.Load rejects by name (that one exists purely so the
      # rejected string can be documented and typo-matched). It is still
      # not a secret worth keeping: generate a real value with
      # `openssl rand -base64 32` and set it out-of-band (an env file
      # kept out of version control, or your orchestrator's own secret
      # store) before this ever runs anywhere but a laptop.
      SESSION_KEY: local-dev-only-session-key-do-not-deploy-this-value
      FIRST_ADMIN_EMAIL: admin@example.com
      FIRST_ADMIN_PASSWORD: change-me-please
      REGISTRATION_MODE: invite_only
    ports:
      - "${MAESTRO_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
      POSTGRES_DB: maestro
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
