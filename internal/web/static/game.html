<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">This page needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page">
<div class="page-head">
<h1 id="game-name" data-i18n="frame.loading"></h1>
  <!-- What this screen cannot do, where the button would be.
       pages/page.js setReadOnly fills it. -->
  <span class="page-actions" id="page-actions"></span>
</div>
<p class="muted" id="game-summary" aria-live="polite" data-i18n="frame.loadingGame"></p>

<!-- **The one thing to do on a game with nothing in it.** The three
     lanes below each say an agent writes their content and nothing on
     the page does, which is true and is where a designer stopped: there
     was no way across from here, and the tokens that make the crossing
     possible had no screen at all. pages/home.js fills this for a reader
     who may mint one, and leaves it empty for everybody else and for
     every game that already has content. -->
<div id="connect-agent" hidden></div>

<!-- **Bands, not columns, and four peers rather than three.** These
     were three columns named after the three tables the product stores
     things in: views, types, documents. A designer's model of their own
     game is its missions, its places, its classes and the writing about
     them, so the page became one column a reader goes down.

     Three columns failed both states this page has. Empty, they tripled
     the same bad news and buried the one action above them. Full, they
     were three lanes competing for one glance and a long list had a
     third of the window to sit in.

     What replaced them put the connections *inside* the content band,
     under a heading one step down, and that was a claim about the
     metamodel nobody meant to make: entity types and relation types are
     two halves of one pair, and the page taught a reader that one
     contains the other. A reader said so. The two are peers now, each a
     section with its own Headline heading, and docs/design.md's Band
     Rule is where that is argued.

     The pairing is the other half: those two bands encode the same unit
     and are read against each other, so above 1200px they stand side by
     side — pages/home.js sets `pair` on this element, and only when both
     have rows. The long list never pairs, which is the half of the
     three-column failure that was about width.

     The order is asserted rather than left to this file: pages/page.js
     declares DESTINATIONS and pages/home.js renders in that order. -->
<div id="home" class="lanes" hidden>
  <section class="lane lane-paired" id="lane-catalogue" aria-labelledby="lane-catalogue-heading">
    <h2 id="lane-catalogue-heading" data-i18n="home.band.content"></h2>
    <!-- What a reader is looking at, standing, in the words a designer
         uses for their own game. It is in the shell and not in
         pages/home.js because it never varies: not with the data, not
         with who is reading. The holes below do both. -->
    <p class="band-note" data-i18n="home.band.content.note"></p>
    <ul class="catalogue" id="types"></ul>
    <!-- The hole; pages/home.js carries the words, including the half
         that depends on who is reading: an editor can have a type
         declared, a viewer cannot, and telling a viewer to do what the
         server will refuse is worse than telling them nothing. -->
    <div id="types-empty" hidden></div>
  </section>

  <section class="lane lane-paired" id="lane-connections" aria-labelledby="lane-connections-heading">
    <h2 id="lane-connections-heading" data-i18n="home.band.connections"></h2>
    <p class="band-note" data-i18n="home.band.connections.note"></p>
    <ul class="catalogue" id="relation-types"></ul>
    <div id="relation-types-empty" hidden></div>
  </section>

  <section class="lane" id="lane-views" aria-labelledby="lane-views-heading">
    <h2 id="lane-views-heading" data-i18n="home.band.overviews"></h2>
    <p class="band-note" data-i18n="home.band.overviews.note"></p>
    <ul class="catalogue" id="views" hidden></ul>
    <!-- A sentence and a way in, never a *New view* button: this page is
         read, and the one thing a reader of an empty game needs is the
         way to get an agent writing. pages/page.js carries both. -->
    <div id="views-onboarding" hidden></div>
    <p class="error" id="views-error" hidden></p>
  </section>

  <section class="lane" id="prose" aria-labelledby="lane-prose-heading">
    <h2 id="lane-prose-heading" data-i18n="home.band.writing"></h2>
    <p class="band-note" data-i18n="home.band.writing.note"></p>
    <!-- The kinds this game invented, above the documents they describe.
         Maestro ships no vocabulary of them, so nothing but this line
         tells a designer which words their own writing is using. Hidden
         until there is one, because "no kinds" is not a fact worth a
         line. -->
    <p class="muted" id="doc-kinds" hidden></p>
    <ul class="catalogue" id="docs"></ul>
    <div id="docs-empty" hidden></div>
    <p class="error" id="docs-error" hidden></p>
    <button type="button" class="link-button" id="docs-more" data-i18n="home.showMore" hidden></button>
  </section>
</div>


</main>

<script type="module" src="/static/pages/home.js"></script>
