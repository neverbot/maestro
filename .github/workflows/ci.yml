name: ci

on:
  push:
    branches: [master]
  pull_request:
  # So the documentation site can be republished without waiting for a
  # commit, which is how the first run after Pages was enabled was
  # triggered.
  workflow_dispatch:

# **One workflow, not two.** The gate and the two things a green master
# publishes — the image a server pulls and the documentation site — were
# a `ci` workflow and a separate `pages` one, which meant the site was
# published by a run that had never looked at whether the tests passed.
# Now every publish hangs off the same `check` job, and a red gate
# publishes nothing.
concurrency:
  # One run per branch. A pull request cancels its own older run, since
  # only the newest commit's answer matters; master does not, because a
  # cancelled run there could kill a publish half way.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# **Every action here is pinned to a major that runs on Node 24.** They
# were on the majors that ship a Node 20 entrypoint, which the runner
# was already forcing onto 24 and announcing in an annotation on every
# run: a warning today and a failed workflow the day the forcing stops.
# The version each one moved to was read off its own `action.yml`
# (`using: node24`), not guessed from a changelog.

# Least privilege by default; the one job that needs more asks for it
# itself. A workflow that declares nothing here inherits whatever the
# repository's Actions setting happens to be, which is a permission
# decision made somewhere nobody reading this file can see.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # The full gate runs against a real Postgres service container, not
      # a mock — internal/testutil.NewPool skips every test it backs
      # whenever TEST_DATABASE_URL is unset, which would otherwise let a
      # broken migration or query pass CI silently. Setting it here is
      # what turns those tests on instead of skipping them; the service
      # container above is disposable and torn down with the job.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # golangci-lint installed directly, not through a third-party
      # action: this repository's .golangci.yml is v2-schema, and a v1
      # golangci-lint binary cannot even parse it (confirmed locally — a
      # stale v1.62.2 on PATH failed with typecheck errors on every
      # package before being replaced). Pinning the exact binary here is
      # more certain than trusting an action's default version to stay
      # aligned with this repository's config schema.
      # **The same target a developer runs, so the pins live in one
      # place.** The two versions were spelled here and again in the
      # Makefile, and sqlc's two spellings had already drifted apart:
      # `@latest` on a machine and `@v1.31.1` here, for the tool that
      # decides whether the generated SQL is current.
      - run: make tools
      # make check is the same target a developer runs locally before
      # committing (gofmt, vet, lint, sqlc-check, then the full race-
      # enabled test suite) — running it here rather than reimplementing
      # its steps keeps CI and the local gate from drifting apart.
      - run: make check

  # A separate job, not more steps on check above: this builds and boots
  # the actual Dockerfile/compose artifact the Core sub-project's
  # definition of done is written against, which `go test` alone never
  # exercises — go vet and unit tests pass on code that a broken
  # Dockerfile, a missing binary, or a container that panics before
  # opening a listener would still fail to serve at all. Before this job
  # existed, both container-adjacent files this task introduced
  # (Dockerfile, compose.yml) had no CI signal whatsoever and could rot
  # silently. needs: check keeps this from spending a container build on
  # a change that fails the cheaper gate first.
  container:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=${{ github.sha }} -t maestro:ci .
      # --network host, not the default bridge network: it is the
      # simplest way for this freshly built container to reach the
      # postgres service above at localhost:5432 the same way the check
      # job's own tests do, on a Linux runner where --network host
      # actually shares the host's network namespace (this workflow only
      # ever runs on ubuntu-latest).
      - name: Start the container
        run: |
          docker run -d --name maestro-smoke --network host \
            -e DATABASE_URL="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            -e FIRST_ADMIN_EMAIL="admin@example.test" \
            -e FIRST_ADMIN_PASSWORD="ci-smoke-test-password" \
            -e REGISTRATION_MODE="invite_only" \
            maestro:ci
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy within 30s"
          exit 1
      - name: Show container logs
        if: always()
        run: docker logs maestro-smoke
      - name: Stop the container
        if: always()
        run: docker rm -f maestro-smoke

  # The image a deployment pulls.
  #
  # **It runs after both gates, and that ordering is the whole point.**
  # `check` is the repository's own gate (gofmt, vet, lint, sqlc diff,
  # the skill guards and the race-enabled test suite) and `container`
  # proves the image it builds actually serves: builds the Dockerfile,
  # starts it against a real Postgres and waits for /healthz. Publishing
  # before either of them would put an image on the registry that
  # nothing has run.
  #
  # Pushes to master only. A pull request goes through both gates and
  # stops there: an image published from a branch nobody has merged is
  # an image a server can pull by accident.
  publish:
    name: Publish the image
    needs: [check, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The one elevation in this file, and it is scoped to this job:
      # pushing to GitHub's container registry is a write to packages.
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so `git describe` can resolve a tag into
          # the version the binary reports. A shallow clone would stamp
          # every build with the same fallback.
          fetch-depth: 0

      - name: Resolve the version the binary will report
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute the tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what a compose file on a server pulls, and the
          # commit tag is what it pins to when a deployment has to be
          # held at a known-good build or rolled back to one.
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=maestro
            org.opencontainers.image.description=Self-hosted workspace where game designers and their AI agents design a game's content
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No provenance attestation: it adds a second manifest to the
          # tag, and a registry client that does not expect one reports
          # the image as a manifest list with no matching platform.
          provenance: false

  # The documentation site, published from the same green master the
  # image is. It was a workflow of its own, which meant the site went up
  # whether or not the tests had passed; `needs: check` is the whole
  # reason this file now has four jobs instead of two and two.
  #
  # It does not wait for `container`: nothing about the site depends on
  # the image building, and making it wait would hold a docs fix behind
  # a container smoke test it has nothing to do with.
  publish-docs:
    name: Publish the documentation site
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and a queued one waits rather than
    # replacing the running one: a half-published site is worse than a
    # slightly old one. Its own group, separate from this workflow's,
    # because it is the Pages environment that is single-flight and not
    # the run.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # The same command `make docs` runs, with the link check the gate
      # runs: a site whose internal links point at pages it does not
      # have must not be published, which is exactly what happened to
      # the product's onboarding link for a whole build.
      - run: go run ./cmd/maestro-docs -o site -check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
