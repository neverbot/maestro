<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">This page needs JavaScript enabled in this browser.</p>
</noscript>

<!-- Filled by pages/page.js setBreadcrumb once the page knows what it is
     looking at. It replaced this shell's back link: a trail says where you
     are as well as where you came from, in one component instead of four
     spellings across five screens. -->
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<h1 id="doc-title">Loading…</h1>
<p class="muted" id="doc-meta" aria-live="polite">Loading this document…</p>
<!-- Every failure on this page lands here, and nothing else renders
     behind it: a document that could not be read must not look like a
     document with nothing in it. -->
<p class="error" id="doc-error" hidden></p>

<article class="prose" id="doc-body" hidden></article>

<section id="doc-content" hidden>
  <h2>Attached to</h2>
  <ul class="catalogue" id="doc-entities"></ul>
  <p class="muted" id="doc-entities-empty" hidden>
    This document is attached to no entity. An agent attaches one over MCP
    (docs.links.add) or over this game's content routes; nothing on this page
    attaches one.
  </p>

  <h2>History</h2>
  <ul class="history" id="doc-history"></ul>
  <p class="error" id="doc-history-error" hidden></p>
  <button type="button" class="link-button" id="doc-history-more" hidden>Show older versions</button>
  <p class="muted" id="doc-revert-note" hidden></p>

  <h2>Compare</h2>
  <form id="compare-form">
    <label for="compare-from">From version</label>
    <select id="compare-from" name="from_version"></select>
    <label for="compare-to">To version</label>
    <select id="compare-to" name="to_version"></select>
    <button type="submit">Compare</button>
  </form>
  <p class="error" id="compare-error"></p>
  <!-- compare-note is not compare-error. A comparison that says "these
       two versions are identical" or "this shows the whole document
       replaced" is a complete, correct answer; putting it in the error
       line would paint the one bound this page states in the colour it
       uses for things that went wrong. -->
  <p class="muted" id="compare-note" hidden></p>
  <div id="comparison" hidden></div>
</section>

<script type="module" src="/static/doc.js"></script>
