version: "2"
sql:
  - engine: postgresql
    queries: internal/db/queries
    schema: internal/db/migrations
    gen:
      go:
        package: dbq
        out: internal/db/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              type: UUID
              import: github.com/google/uuid
              pointer: true
