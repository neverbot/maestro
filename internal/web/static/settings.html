<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title.settings"></title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">This page needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page">
<nav class="crumbs" id="crumbs" data-i18n-attr="aria-label:frame.breadcrumb"></nav>

<div class="page-head">
<h1 data-i18n="frame.gameSettings"></h1>
  <span class="page-actions" id="page-actions"></span>
</div>

<!-- **Two tabs, because the two halves have two different gates.** The
     game's name and address are the owner's; its tokens are any
     member's to list and revoke and an editor's to mint. One page with
     one gate would either lock an editor out of a credential the server
     grants them or show an owner's form to somebody the server refuses.

     They are tabs and not two sections because the reader comes here for
     one of the two and not for both: a designer connecting an agent has
     no business scrolling past the control that breaks every link into
     the game. pages/settings.js moves the selection and the address's
     #agents carries it, so a link can point at either half. -->
<nav class="tabs" id="settings-tabs" data-i18n-attr="aria-label:settings.sections">
  <button type="button" class="tab" id="tab-game" data-panel="panel-game"
          role="tab" aria-selected="true" aria-controls="panel-game" data-i18n="settings.tab.game"></button>
  <button type="button" class="tab" id="tab-people" data-panel="panel-people"
          role="tab" aria-selected="false" aria-controls="panel-people" data-i18n="settings.tab.people"></button>
  <button type="button" class="tab" id="tab-agents" data-panel="panel-agents"
          role="tab" aria-selected="false" aria-controls="panel-agents" data-i18n="settings.tab.agents"></button>
</nav>

<section id="panel-game" role="tabpanel" aria-labelledby="tab-game">

<!-- The two things a game has that are not its content. Owner-only: a
     viewer or an editor reaching this tab is told so rather than
     shown a form the server will refuse. -->
<form id="game-settings" hidden>
  <label for="game-name" data-i18n="form.name"></label>
  <input id="game-name" type="text" name="name" autocomplete="off" required>
  <p class="muted field-note" data-i18n="settings.name.about"></p>

  <label for="game-slug" data-i18n="form.address"></label>
  <input id="game-slug" type="text" name="slug" autocomplete="off"
         pattern="[a-z0-9]+(-[a-z0-9]+)*" required>
  <!-- **The warning sits above the button, not in a dialog after it.**
       pages/settings.js fills it with this game's own current address,
       so the sentence names the thing that is about to stop working. -->
  <p class="notice" id="address-warning"></p>

  <button type="submit" data-i18n="settings.save.button"></button>
  <p class="error" id="settings-error" role="alert" aria-live="assertive"></p>
</form>

<!-- The hole; pages/settings.js carries the words for a reader who may
     not change these. -->
<div id="settings-refused" hidden></div>

</section>

<section id="panel-people" role="tabpanel" aria-labelledby="tab-people" hidden>

<!-- **A game could be created from the web and never shared from it.**
     The instance's invitations make accounts and grant no game; every
     membership route existed and nothing called it, so in practice a
     game had exactly one person in it — whoever made it. -->
<p class="lede" id="people-lede" data-i18n="settings.people.about"></p>

<h2 data-i18n="settings.invite"></h2>

<!-- Manager-only; pages/settings.js hides this and says why for anybody
     else, rather than offering a form the server will refuse. -->
<form id="invite-member" hidden>
  <label for="invite-email" data-i18n="form.email"></label>
  <input id="invite-email" type="email" name="email" data-i18n-attr="placeholder:placeholder.theirEmail" autocomplete="off" required>
  <label for="invite-role" data-i18n="form.role"></label>
  <select id="invite-role" name="role">
    <option value="viewer" data-i18n="role.viewer"></option>
    <option value="editor" selected data-i18n="role.editor"></option>
    <option value="owner" data-i18n="role.manager"></option>
  </select>
  <p class="muted field-note" data-i18n="settings.invite.about"></p>
  <button type="submit" data-i18n="settings.createInvite"></button>
  <p class="error" id="invite-member-error" role="alert" aria-live="assertive"></p>
</form>

<!-- The hole for somebody who may read this list and not change it. -->
<div id="people-refused" hidden></div>

<!-- The secret, once. Each link stays and the earlier ones are marked,
     because a second invitation must not destroy the only copy of the
     first — the same decision the instance's invitations record. -->
<div class="secret" id="invite-made" role="status" aria-live="polite" hidden>
  <b data-i18n="invite.sendLink"></b>
  <div id="invite-links"></div>
</div>

<h2 data-i18n="settings.members"></h2>
<div class="scroller">
  <ul class="people" id="members" hidden></ul>
</div>
<div id="members-empty" hidden></div>
<p class="error" id="members-error" hidden></p>

<h2 data-i18n="settings.invitesOutstanding"></h2>
<div class="scroller">
  <ul class="people" id="game-invites" hidden></ul>
</div>
<div id="game-invites-empty" hidden></div>

</section>

<section id="panel-agents" role="tabpanel" aria-labelledby="tab-agents" hidden>

<!-- **What this screen is for, said once.** A designer who has just
     made a game cannot write a line of its content by hand: an agent
     writes it, over MCP, holding a token that opens this game and no
     other. Everything below is in service of one paste. -->
<p class="lede" id="agents-lede" data-i18n="settings.agents.about"></p>

<h2 data-i18n="settings.connectAgent"></h2>

<!-- Minting is an editor's or the owner's; pages/settings.js hides this
     form and fills #agents-refused for anybody else, rather than
     offering a button the server will refuse. -->
<form id="create-token" hidden>
  <label for="token-label" data-i18n="settings.token.whatFor"></label>
  <input id="token-label" type="text" name="label" autocomplete="off"
         data-i18n-attr="placeholder:settings.placeholder.tokenName" required>
  <p class="muted field-note" data-i18n="settings.token.nameAbout"></p>
  <button type="submit" data-i18n="settings.token.create"></button>
  <p class="error" id="create-token-error" role="alert" aria-live="assertive"></p>
</form>

<!-- The hole for a reader who may list and revoke but not mint. -->
<div id="agents-refused" hidden></div>

<h2 data-i18n="settings.tokens"></h2>
<!-- Which of the two listings this is; pages/settings.js carries the
     words, and the server carries the decision. -->
<p class="muted" id="tokens-whose"></p>
<!-- **Not a `catalogue`.** Every catalogue in this product is a fixed
     six-cell grid marked up as a table, and this list carries a control:
     a button in a table cell is read as data. It carried the class
     anyway, which handed it the catalogue's seven tracks — so the four
     it declares were never the ones it got, the columns landed wherever
     that left them and the revoke sat two hundred pixels short of the
     right edge. -->
<div class="scroller">
  <ul class="tokens" id="tokens" hidden></ul>
</div>
<div id="tokens-empty" hidden></div>
<p class="error" id="tokens-error" hidden></p>

</section>

</main>

<script type="module" src="/static/pages/settings.js"></script>
