<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sign in · Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">Signing in needs JavaScript enabled in this browser.</p>
</noscript>

<!-- The one screen with no header, so the wordmark is inside the column
     rather than above it: outside the page container it drew flush to the
     window's left edge and its own line box was clipped at the top. -->
<main class="page sign-in">
<h1>Maestro</h1>

<div id="login-view">
  <p class="lede">Sign in to reach your games.</p>
  <form id="login">
    <label for="login-email">Email</label>
    <!-- The one screen with one purpose and three controls: the cursor
         starts where the reader would put it. -->
    <input id="login-email" type="email" name="email" placeholder="you@studio.com" autocomplete="username" autofocus required>
    <label for="login-password">Password</label>
    <input id="login-password" type="password" name="password" autocomplete="current-password" required>
    <!-- **Under the field, above the button.** It was below the submit
         button, so a refusal was read in the order field, action, reason:
         `markRefused` moves the focus back to the password and marks it,
         and the sentence explaining why sat 70px past the control the
         reader had just been sent back to. -->
    <p class="error" id="login-error" role="alert" aria-live="assertive"></p>
    <button type="submit">Sign in</button>
  </form>
  <!-- **The recovery that does not exist, said where somebody locked out
       would look for it.** There is no forgot-password flow anywhere in
       this product and there cannot be: accounts are local and no email
       is ever sent. Principle 5 is that what the product cannot do is
       written on the screen where somebody would look for it, and this
       is that screen. -->
  <p class="muted sign-in-note">There is no password reset. This instance sends no email, so an
    administrator invites you again instead.</p>
  <p id="register-toggle-wrap" hidden>
    <button type="button" id="register-toggle" class="link-button">Create an account</button>
  </p>
</div>

<div id="invite-view" hidden>
  <p id="invite-copy">You have been invited to Maestro. Create your account to continue.</p>
  <form id="invite">
    <label for="invite-email">Email</label>
    <input id="invite-email" type="email" name="email" placeholder="you@studio.com" autocomplete="username" required>
    <label for="invite-display-name">Your name</label>
    <input id="invite-display-name" type="text" name="display_name" placeholder="Your name" autocomplete="name" required>
    <label for="invite-password">Password</label>
    <input id="invite-password" type="password" name="password" placeholder="At least 12 characters" autocomplete="new-password" minlength="12" required>
    <button type="submit">Create account</button>
    <p class="error" id="invite-error" role="alert" aria-live="assertive"></p>
  </form>
  <p><button type="button" id="back-to-login" class="link-button">Back to sign in</button></p>
</div>

<!-- **Below the forms, not above them.** This line says who the instance
     admits, and it was the first thing a person read, before the sentence
     telling them what to do here. A restriction read before the action is
     a door with the rules written on it and no handle. -->
<p class="muted sign-in-note" id="mode-notice" hidden></p>
</main>

<script type="module" src="/static/app.js"></script>
