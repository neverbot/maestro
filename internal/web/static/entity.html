<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entity · Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">This page needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page">
<!-- Filled by pages/page.js setBreadcrumb once the page knows what it is
     looking at. It replaced this shell's back link: a trail says where you
     are as well as where you came from, in one component instead of four
     spellings across five screens. -->
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<div class="page-head">
<h1 id="entity-name">Loading…</h1>
  <!-- What this screen cannot do, where the button would be, **and what
       it now can**: the rename control replaces the read-only notice on
       this screen, because the notice is a claim about the screen and
       this screen no longer refuses a name. pages/entity.js decides
       which of the two goes here, from the caller's role. -->
  <span class="page-actions" id="page-actions"></span>
</div>

<!-- The rename, in place, opened by the control above. It is the
     product's first write by a person, and what it does with a refusal
     is the design: never a retry, never a silent merge.
     .superpowers/specs/2026-09-11-writing-in-the-interface-design.md -->
<form id="rename" hidden>
  <label for="rename-name">Name</label>
  <input id="rename-name" type="text" autocomplete="off" maxlength="200" required>
  <p class="error" id="rename-error" role="alert" aria-live="assertive"></p>
  <div class="rename-actions">
    <button type="submit">Save the name</button>
    <button type="button" class="ghost" id="rename-cancel">Cancel</button>
  </div>
</form>

<!-- Somebody else wrote while this was open. Two values, labelled, and
     two actions with no default: the product has no opinion about whose
     text is better, and a pre-selected answer would be it having one. -->
<div class="secret conflict" id="rename-conflict" role="status" aria-live="polite" hidden>
  <b>Somebody changed this while you were editing</b>
  <dl class="facts">
    <dt>Theirs</dt><dd id="conflict-theirs"></dd>
    <dt>Yours</dt><dd id="conflict-yours"></dd>
  </dl>
  <div class="rename-actions">
    <button type="button" class="ghost" id="conflict-keep">Keep mine</button>
    <button type="button" class="ghost" id="conflict-take">Take theirs</button>
  </div>
</div>
<p class="mono" id="entity-address" aria-live="polite"></p>
<p class="error" id="entity-error" hidden></p>

<section id="entity-content" hidden>
  <!-- **Empty on purpose.** Everything under this heading is built by
       pages/entity.js's `entityBody`, which is the same builder the side
       panel over a diagram uses, so the page and the panel can never
       come to say different things. Four `.state` blocks lived here and
       none of them ever rendered: the body replaces this element's
       children wholesale, so the shell's own copy — including the half
       naming who would attach a document — was read by nobody for as
       long as this page has existed. The states are in the builder now,
       where they are shown. -->
</section>

</main>

<script type="module" src="/static/pages/entity.js"></script>
