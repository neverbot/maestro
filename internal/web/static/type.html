<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entities · Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">This page needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page">
<!-- Filled by pages/page.js setBreadcrumb once the page knows what it is
     looking at. It replaced this shell's back link: a trail says where you
     are as well as where you came from, in one component instead of four
     spellings across five screens. -->
<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>

<div class="page-head">
<h1 id="type-name">Loading…</h1>
  <!-- What this screen cannot do, where the button would be.
       pages/page.js setReadOnly fills it. -->
  <span class="page-actions" id="page-actions"></span>
</div>
<p class="muted" id="type-meta" aria-live="polite"></p>
<!-- Said out loud, because this page is deliberately close in
     appearance to the `table` renderer and is not one: it lists every
     entity of a declared type, in the order its column headings are set
     to, and answers no query. -->
<p class="muted" id="type-note"></p>

<!-- **Search, on the screen that most needs it.** A type with a thousand
     entities was a thousand rows in one order with no way to find one, and
     the server indexes a row's key alongside its name — so the handle a
     designer meets in every error message is the one that works here. -->
<div class="tools">
  <input id="entities-search" type="search" placeholder="Find by name or key…"
         autocomplete="off" aria-label="Find an entity of this type">
  <!-- **The one filter a person can compose.** Search answers the fifty
       best matches for a word and cannot be paged past them; this narrows
       the listing itself, so a thousand entities become the ones whose
       name starts with what you typed and every one of them is reachable
       by the pager underneath. The listing's order is by name, so the
       server answers it by walking a contiguous stretch of the order it
       was already walking. -->
  <label class="tools-label" for="entities-prefix">Starting with</label>
  <input id="entities-prefix" type="text" placeholder="Th" autocomplete="off" size="8"
         aria-label="Show only the entities whose name starts with">
  <!-- A row a schema edit stopped fitting is work a designer has to do,
       and until now the only way to find those rows was to scroll a
       thousand of them looking for the flag. -->
  <label class="tools-check"><input id="entities-invalid" type="checkbox"> Only the ones that no longer fit</label>
  <span class="tools-note muted" id="entities-scope" aria-live="polite"></span>
</div>

<!-- **The scroller, so a row is a row at any width.** Without it a
     62-character quest name collapsed the name track to zero at a 420px
     list and set the label one word per line: a measured 261px row with
     the key overlapping the name. The frame spec specifies exactly this
     and it was never built. -->
<!-- **What the columns are not showing.** The catalogue draws at most
     three of a type's declared fields, deliberately — a lane of ten
     columns is a spreadsheet and this is a reading surface — but it said
     nothing about the rest, so a type declaring eight fields showed
     three and looked like a type with three. pages/catalogue.js fills
     this and leaves it empty when nothing is hidden. -->
<p class="muted" id="entities-columns" hidden></p>
<div class="scroller">
  <ul class="catalogue wide" id="entities" hidden></ul>
</div>
<div class="state" id="entities-empty" hidden>
  <b>Nothing of this type yet</b>
  <span id="entities-empty-action">An agent writes them; nothing on this page does.</span>
</div>
<!-- A search that found nothing is its own state, and it names what the
     type does hold: "Nothing of this type yet" under a heading saying 105
     entities is the page contradicting itself three lines apart. -->
<div class="state" id="entities-miss" hidden>
  <b id="entities-miss-head"></b>
  <span id="entities-miss-body"></span>
</div>
<p class="error" id="entities-error" hidden></p>
<button type="button" class="btn-more" id="entities-more" hidden>Show more</button>

</main>

<script type="module" src="/static/pages/catalogue.js"></script>
