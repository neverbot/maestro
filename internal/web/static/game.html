<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maestro</title>
<link rel="stylesheet" href="/static/styles.css">
<!-- Applies the chosen theme before the first paint. Classic and not
     deferred on purpose: see static/theme.js. -->
<script src="/static/theme.js"></script>
<!-- The import map is what makes `import { LitElement, html } from "lit"`
     resolve with no build step, which is the invariant this whole front
     end rests on. It must appear before the first module script in the
     document, and it must be the same map in every shell: a shell with a
     stale map is a page that 404s one module and renders three quarters
     of itself. internal/web/static_vendor_test.go holds both rules, and
     internal/web/static/vendor/manifest.json records what each target
     is, where it came from and what it weighs. -->
<script type="importmap">
{"imports": {
  "lit": "/static/vendor/lit-core.min.js",
  "dagre": "/static/vendor/dagre.mjs",
  "graphlib": "/static/vendor/graphlib.mjs"
}}
</script>
<noscript>
  <p class="notice">This page needs JavaScript enabled in this browser.</p>
</noscript>

<main class="page">
<div class="page-head">
<h1 id="game-name">Loading…</h1>
  <!-- What this screen cannot do, where the button would be.
       pages/page.js setReadOnly fills it. -->
  <span class="page-actions" id="page-actions"></span>
</div>
<p class="muted" id="game-summary" aria-live="polite">Loading this game…</p>

<!-- **The one thing to do on a game with nothing in it.** The three
     lanes below each say an agent writes their content and nothing on
     the page does, which is true and is where a designer stopped: there
     was no way across from here, and the tokens that make the crossing
     possible had no screen at all. pages/home.js fills this for a reader
     who may mint one, and leaves it empty for everybody else and for
     every game that already has content. -->
<div id="connect-agent" hidden></div>

<!-- Three lanes, in this order, and the order is the product's map:
     **Views · Catalogue · Prose**. The metamodel has four primitives
     (entity types, entities, relation types, relations) and the product
     has three surfaces over them — the pictures a designer reads, the
     vocabulary the game declared, and the prose beside it — so a
     designer holds the whole tool in their head on day one instead of
     discovering a fourth place things live in.

     The lane order is asserted rather than left to this file: pages/
     page.js declares DESTINATIONS and pages/home.js renders in that
     order, so a reordered home is a failing check and not a surprise. -->
<div id="home" class="lanes" hidden>
  <section class="lane" id="lane-views" aria-labelledby="lane-views-heading">
    <h2 id="lane-views-heading">Views</h2>
    <ul class="catalogue" id="views" hidden></ul>
    <!-- The one piece of onboarding in this product: a sentence and a
         link, never a *New view* button. pages/page.js carries both. -->
    <div id="views-onboarding" hidden></div>
    <p class="error" id="views-error" hidden></p>
  </section>

  <section class="lane" id="lane-catalogue" aria-labelledby="lane-catalogue-heading">
    <h2 id="lane-catalogue-heading">Catalogue</h2>
    <ul class="catalogue" id="types"></ul>
    <!-- The shared negative state, the shape every empty, loading and
         refused answer in the product wears. The second line depends on
         who is reading: an editor can declare a type, a viewer cannot,
         and telling a viewer to do what the server will refuse is worse
         than telling them nothing. pages/home.js fills it from the
         caller's own role, which GET /summary carries. -->
    <!-- The hole; pages/home.js carries the words, including the half
         that depends on who is reading. -->
<div id="types-empty" hidden></div>

    <h3>Relation types</h3>
    <ul class="catalogue" id="relation-types"></ul>
    <div id="relation-types-empty" hidden></div>
  </section>

  <section class="lane" id="prose" aria-labelledby="lane-prose-heading">
    <h2 id="lane-prose-heading">Prose</h2>
    <!-- The kind vocabulary, above the documents it describes. A kind is
         free text this game invented, so nothing but this line can tell a
         designer what vocabulary their own prose is using; it is the prose
         half of the entity-type catalogue beside it. Hidden until there is
         a kind to show, because "no kinds" is not a fact worth a line. -->
    <p class="muted" id="doc-kinds" hidden></p>
    <ul class="catalogue" id="docs"></ul>
    <!-- Same rule as the types empty state above: the second line depends
         on who is reading, and a viewer must not be told to do what the
         server will refuse. -->
    <div id="docs-empty" hidden></div>
    <p class="error" id="docs-error" hidden></p>
    <button type="button" class="link-button" id="docs-more" hidden>Show more documents</button>
  </section>
</div>


</main>

<script type="module" src="/static/pages/home.js"></script>
